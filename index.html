<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notas Tonecho</title>
    <!-- Enlace al archivo de instrucciones del móvil -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Iconos modernos de Google -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        /* --- DISEÑO MODO OSCURO PREMIUM (NOTAS TONECHO) --- */
        :root {
            --bg-dark-body: #090d16;
            --bg-card: #151f32;
            --bg-input: #1e2d4a;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            
            --color-personal: linear-gradient(135deg, #ff4757, #ff6b81);
            --color-trabajo: linear-gradient(135deg, #2e86de, #54a0ff);
            --color-casa: linear-gradient(135deg, #10ac84, #1dd1a1);
            --color-familia: linear-gradient(135deg, #8e44ad, #9b59b6);
            
            --danger: #ff6b6b;
            --success: #1dd1a1;
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark-body);
            color: var(--text-light);
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--bg-card);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            padding: 20px;
            height: calc(100vh - 20px);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-glass);
            overflow: hidden;
        }

        #home-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        header {
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 15px;
            flex-shrink: 0;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }
        
        h1 span {
            background: linear-gradient(135deg, #54a0ff, #1dd1a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            flex-grow: 1;
            margin-bottom: 10px;
        }

        .category-card {
            border: none;
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s ease;
            color: white;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            height: 100%;
            position: relative;
        }

        .cat-personal { background: var(--color-personal); }
        .cat-trabajo { background: var(--color-trabajo); }
        .cat-casa { background: var(--color-casa); }
        .cat-familia { background: var(--color-familia); }

        .category-card:active {
            transform: scale(0.96);
            filter: brightness(1.1);
        }

        .category-card span.material-icons-round {
            font-size: 52px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.25);
        }

        .category-card .cat-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .count-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 700;
        }

        .section-view {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-glass);
            flex-shrink: 0;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            text-transform: capitalize;
            color: #fff;
            flex-grow: 1;
        }

        /* --- FORMULARIO --- */
        .note-form {
            background: var(--bg-input);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 15px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .note-input {
            width: 100%;
            border: none;
            background: transparent;
            resize: none;
            font-size: 15px;
            outline: none;
            min-height: 60px;
            margin-bottom: 10px;
            color: var(--text-light);
        }
        
        .note-input::placeholder {
            color: #64748b;
        }

        .preview-container {
            display: none;
            position: relative;
            margin-bottom: 12px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-glass);
        }

        .preview-container img {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            display: block;
        }

        .btn-remove-preview {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .recording-status {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--danger);
            font-weight: 600;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .media-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .btn-action.active {
            background: rgba(255, 107, 107, 0.2);
            color: var(--danger);
            border-color: var(--danger);
        }

        .btn-add-note {
            background: linear-gradient(135deg, #1dd1a1, #10ac84);
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: 700;
        }

        /* --- LISTADO DE NOTAS CON DRAG & DROP Y TACHADO --- */
        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 2px;
        }

        .notes-list::-webkit-scrollbar { width: 4px; }
        .notes-list::-webkit-scrollbar-thumb { background: var(--border-glass); border-radius: 4px; }

        .note-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-shrink: 0;
            user-select: none;
            touch-action: manipulation;
            transition: transform 0.15s, opacity 0.2s;
        }

        .note-item.dragging {
            opacity: 0.4;
            background: rgba(84, 160, 255, 0.1);
            border-color: #54a0ff;
        }

        .drag-handle {
            color: var(--text-muted);
            cursor: grab;
            touch-action: none;
            display: flex;
            align-items: center;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .checkbox .material-icons-round {
            font-size: 16px;
            display: none;
            color: #090d16;
            font-weight: bold;
        }

        .note-item.tachado {
            opacity: 0.5;
        }

        .note-item.tachado .checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .note-item.tachado .checkbox .material-icons-round {
            display: block;
        }

        .note-item.tachado .note-content {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .note-content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            word-break: break-word;
            cursor: pointer;
        }

        .note-content {
            font-size: 14px;
            line-height: 1.4;
            color: var(--text-light);
        }

        .media-badges {
            display: flex;
            gap: 6px;
            font-size: 12px;
        }

        .note-image-thumb {
            width: 100%;
            max-height: 140px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 4px;
            border: 1px solid var(--border-glass);
        }

        .note-audio-player {
            width: 100%;
            height: 32px;
            margin-top: 4px;
            border-radius: 8px;
        }

        .note-expiry {
            font-size: 10px;
            color: var(--danger);
            font-weight: 600;
        }

        .note-actions {
            display: flex;
            gap: 2px;
            align-items: center;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:active {
            background: rgba(255, 255, 255, 0.08);
        }

        /* --- MODAL DETALLE / EDICIÓN --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 10px;
        }

        .modal-header h3 { font-size: 16px; font-weight: 700; }

        .img-preview-full {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 10px;
            background: #000;
            cursor: zoom-in;
            border: 1px solid var(--border-glass);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 10px;
        }

        /* Modal para Foto Ampliada Pantalla Completa */
        .modal-zoom {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        .modal-zoom.active { display: flex; }
        .modal-zoom img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 8px; }
    </style>

    <!-- FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAFnywv6kE1UJcw2SdDdEgxftMy5q7wBo",
            authDomain: "notas-tonecho.firebaseapp.com",
            databaseURL: "https://notas-tonecho-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "notas-tonecho",
            storageBucket: "notas-tonecho.firebasestorage.app",
            messagingSenderId: "519494944214",
            appId: "1:519494944214:web:b7e292cccc219ac803d077",
            measurementId: "G-YKFF06FCXL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // UI Elements
        const homeScreen = document.getElementById('home-screen');
        const sectionScreen = document.getElementById('section-screen');
        const sectionTitle = document.getElementById('section-title');
        const noteTextInput = document.getElementById('note-text-input');
        const notesListContainer = document.getElementById('notes-list-container');
        
        // Media Elements Form
        const cameraInput = document.getElementById('camera-input');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');
        const recordingStatus = document.getElementById('recording-status');
        const btnMic = document.getElementById('btn-mic');

        let categoriaActual = '';
        let notasLocales = [];
        
        let base64ImageData = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let base64AudioData = null;
        let isRecording = false;

        // Modal Variables
        let itemEditandoId = null;
        let modalFotoBase64 = null;
        let modalAudioBase64 = null;
        let modalMediaRecorder = null;
        let modalAudioChunks = [];
        let modalIsRecording = false;

        // Sincronización en tiempo real general para contadores
        const dbRefAll = ref(db, 'notas');
        onValue(dbRefAll, (snapshot) => {
            const data = snapshot.val() || {};
            actualizarContadoresCategorias(data);
            
            if (categoriaActual) {
                const notas = [];
                Object.keys(data).forEach((key) => {
                    if (data[key].categoria === categoriaActual) {
                        notas.push({ id: key, ...data[key] });
                    }
                });
                notasLocales = notas;
                renderizarNotas(notasLocales);
            }
        });

        function actualizarContadoresCategorias(data) {
            const counts = { personal: 0, trabajo: 0, casa: 0, familia: 0 };
            Object.values(data).forEach(n => {
                if (!n.tachado && counts[n.categoria] !== undefined) {
                    counts[n.categoria]++;
                }
            });
            document.getElementById('badge-personal').textContent = `${counts.personal} u.`;
            document.getElementById('badge-trabajo').textContent = `${counts.trabajo} u.`;
            document.getElementById('badge-casa').textContent = `${counts.casa} u.`;
            document.getElementById('badge-familia').textContent = `${counts.familia} u.`;
        }

        window.abrirSeccion = function(categoria) {
            categoriaActual = categoria;
            homeScreen.style.display = 'none';
            sectionScreen.style.display = 'flex';
            sectionTitle.textContent = categoria;
            resetMediaForm();
            renderizarNotas(notasLocales.filter(n => n.categoria === categoriaActual));
        }

        window.volverAInicio = function() {
            sectionScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
            categoriaActual = '';
            resetMediaForm();
        }

        // --- MULTIMEDIA DESDE FORMULARIO ---
        window.activarCamara = function() { cameraInput.click(); }

        cameraInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    base64ImageData = event.target.result;
                    imagePreview.src = base64ImageData;
                    previewContainer.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        window.cancelarFoto = function() {
            base64ImageData = null;
            imagePreview.src = '';
            previewContainer.style.display = 'none';
            cameraInput.value = '';
        }

        window.toggleGrabacionAudio = async function() {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.addEventListener("dataavailable", event => audioChunks.push(event.data));
                    mediaRecorder.addEventListener("stop", () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            base64AudioData = reader.result;
                            recordingStatus.innerHTML = `<span class="material-icons-round" style="font-size:16px;">check_circle</span> Audio preparado.`;
                        };
                        reader.readAsDataURL(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    });

                    mediaRecorder.start();
                    isRecording = true;
                    btnMic.classList.add('active');
                    recordingStatus.style.display = 'flex';
                    recordingStatus.innerHTML = `<span class="material-icons-round" style="font-size:16px;">fiber_manual_record</span> Grabando nota de voz...`;
                } catch (err) {
                    alert("Acepta los permisos de micrófono para grabar audios.");
                }
            } else {
                if (mediaRecorder) mediaRecorder.stop();
                isRecording = false;
                btnMic.classList.remove('active');
            }
        }

        function resetMediaForm() {
            cancelarFoto();
            base64AudioData = null;
            isRecording = false;
            if (btnMic) btnMic.classList.remove('active');
            if (recordingStatus) recordingStatus.style.display = 'none';
            if (noteTextInput) noteTextInput.value = '';
        }

        // GUARDAR NUEVA NOTA
        window.guardarNuevaNota = async function() {
            const texto = noteTextInput.value.trim();
            if (texto === '' && !base64ImageData && !base64AudioData) return;

            try {
                const dbRef = ref(db, 'notas');
                const nuevaNotaRef = push(dbRef);
                await set(nuevaNotaRef, {
                    categoria: categoriaActual,
                    contenido: texto,
                    foto: base64ImageData || null,
                    audio: base64AudioData || null,
                    tachado: false,
                    fechaTachado: null,
                    fechaCreacion: Date.now(),
                    orden: Date.now()
                });
                
                resetMediaForm();
            } catch (error) {
                alert("Error al guardar: " + error.message);
            }
        }

        // TACHAR Y LIMPIEZA A LOS 7 DÍAS
        window.alternarTacharNota = async function(id, estadoActual) {
            const nuevoEstado = !estadoActual;
            try {
                const notaRef = ref(db, `notas/${id}`);
                await update(notaRef, {
                    tachado: nuevoEstado,
                    fechaTachado: nuevoEstado ? Date.now() : null
                });
            } catch (error) {
                console.error("Error al tachar: ", error);
            }
        }

        window.eliminarNotaDefinitiva = async function(id) {
            try {
                const notaRef = ref(db, `notas/${id}`);
                await remove(notaRef);
            } catch (error) {
                console.error("Error al eliminar: ", error);
            }
        }

        // INTEGRACIÓN CON GOOGLE CALENDAR
        window.crearEventoGoogleCalendar = function(id) {
            const nota = notasLocales.find(n => n.id === id);
            if (!nota) return;

            const titulo = encodeURIComponent(nota.contenido || "Nota de Tonecho");
            let detallesTexto = `Categoría: ${nota.categoria}\nCreada en Notas Tonecho.`;
            if (nota.foto) detallesTexto += `\n(Tiene foto adjunta)`;
            if (nota.audio) detallesTexto += `\n(Tiene audio adjunto)`;

            const detalles = encodeURIComponent(detallesTexto);
            const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${titulo}&details=${detalles}`;
            window.open(url, '_blank');
        }

        // MOSTRAR NOTAS Y REORDENACIÓN
        async function renderizarNotas(notas) {
            notesListContainer.innerHTML = '';
            const ahora = Date.now();
            const sieteDiasMs = 7 * 24 * 60 * 60 * 1000;

            if (notas.length === 0) {
                notesListContainer.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:14px; margin-top:20px;">No hay notas aquí.</p>';
                return;
            }

            // Ordenamiento por posición o fecha de creación
            notas.sort((a, b) => (a.orden || a.fechaCreacion) - (b.orden || b.fechaCreacion));

            for (const nota of notas) {
                // Auto-limpieza a los 7 días de estar tachado
                if (nota.tachado && nota.fechaTachado && (ahora - nota.fechaTachado > sieteDiasMs)) {
                    await eliminarNotaDefinitiva(nota.id);
                    continue;
                }

                const notaDiv = document.createElement('div');
                notaDiv.className = `note-item ${nota.tachado ? 'tachado' : ''}`;
                notaDiv.draggable = true;
                notaDiv.dataset.id = nota.id;

                let textoExpiracion = '';
                if (nota.tachado && nota.fechaTachado) {
                    const msRestantes = (nota.fechaTachado + sieteDiasMs) - ahora;
                    const diasRestantes = Math.ceil(msRestantes / (1000 * 60 * 60 * 24));
                    textoExpiracion = `<span class="note-expiry">Se elimina en ${diasRestantes} d.</span>`;
                }

                let elementoFoto = nota.foto ? `<img src="${nota.foto}" class="note-image-thumb" onclick="event.stopPropagation(); ampliarImagen('${nota.foto}')">` : '';
                let elementoAudio = nota.audio ? `<audio controls class="note-audio-player" src="${nota.audio}"></audio>` : '';

                notaDiv.innerHTML = `
                    <div class="drag-handle"><span class="material-icons-round">drag_indicator</span></div>
                    <div class="checkbox" onclick="event.stopPropagation(); alternarTacharNota('${nota.id}', ${nota.tachado})">
                        <span class="material-icons-round">done</span>
                    </div>
                    <div class="note-content-wrapper" onclick="abrirModalDetalle('${nota.id}')">
                        ${nota.contenido ? `<div class="note-content">${nota.contenido}</div>` : ''}
                        ${elementoFoto}
                        ${elementoAudio}
                        ${textoExpiracion}
                    </div>
                    <div class="note-actions">
                        <button class="btn-icon" title="Google Calendar" onclick="event.stopPropagation(); crearEventoGoogleCalendar('${nota.id}')">
                            <span class="material-icons-round" style="color: #54a0ff;">today</span>
                        </button>
                        <button class="btn-icon" title="Eliminar" onclick="event.stopPropagation(); eliminarNotaDefinitiva('${nota.id}')">
                            <span class="material-icons-round" style="color: var(--danger);">delete</span>
                        </button>
                    </div>
                `;

                // Eventos Drag & Drop PC
                notaDiv.addEventListener('dragstart', handleDragStart);
                notaDiv.addEventListener('dragover', handleDragOver);
                notaDiv.addEventListener('drop', handleDrop);
                notaDiv.addEventListener('dragend', handleDragEnd);

                // Eventos táctiles Móvil
                const handle = notaDiv.querySelector('.drag-handle');
                handle.addEventListener('touchstart', handleTouchStart, { passive: false });
                handle.addEventListener('touchmove', handleTouchMove, { passive: false });
                handle.addEventListener('touchend', handleTouchEnd);

                notesListContainer.appendChild(notaDiv);
            }
        }

        // DRAG & DROP LÓGICA DE REORDENADO
        let dragSrcId = null;

        function handleDragStart(e) {
            dragSrcId = this.dataset.id;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            return false;
        }

        async function handleDrop(e) {
            if (e.stopPropagation) e.stopPropagation();
            const targetId = this.dataset.id;
            if (dragSrcId && targetId && dragSrcId !== targetId) {
                reordenarNotasArray(dragSrcId, targetId);
            }
            return false;
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
        }

        let touchDraggedDiv = null;

        function handleTouchStart(e) {
            e.preventDefault();
            touchDraggedDiv = this.closest('.note-item');
            dragSrcId = touchDraggedDiv.dataset.id;
            touchDraggedDiv.classList.add('dragging');
        }

        function handleTouchMove(e) {
            if (!touchDraggedDiv) return;
            e.preventDefault();
            const touchLocation = e.touches[0];
            const targetElement = document.elementFromPoint(touchLocation.clientX, touchLocation.clientY);
            if (targetElement) {
                const targetDiv = targetElement.closest('.note-item');
                if (targetDiv && targetDiv !== touchDraggedDiv) {
                    const children = Array.from(notesListContainer.children);
                    const draggedIndex = children.indexOf(touchDraggedDiv);
                    const targetIndex = children.indexOf(targetDiv);
                    if (draggedIndex < targetIndex) {
                        notesListContainer.insertBefore(touchDraggedDiv, targetDiv.nextSibling);
                    } else {
                        notesListContainer.insertBefore(touchDraggedDiv, targetDiv);
                    }
                }
            }
        }

        async function handleTouchEnd(e) {
            if (!touchDraggedDiv) return;
            touchDraggedDiv.classList.remove('dragging');
            
            const newOrderIds = Array.from(notesListContainer.children).map(div => div.dataset.id);
            newOrderIds.forEach((id, index) => {
                const notaRef = ref(db, `notas/${id}`);
                update(notaRef, { orden: index });
            });

            touchDraggedDiv = null;
            dragSrcId = null;
        }

        async function reordenarNotasArray(fromId, toId) {
            const ids = Array.from(notesListContainer.children).map(div => div.dataset.id);
            const fromIndex = ids.indexOf(fromId);
            const toIndex = ids.indexOf(toId);

            if (fromIndex !== -1 && toIndex !== -1) {
                ids.splice(fromIndex, 1);
                ids.splice(toIndex, 0, fromId);

                ids.forEach((id, index) => {
                    const notaRef = ref(db, `notas/${id}`);
                    update(notaRef, { orden: index });
                });
            }
        }

        // --- MODAL DETALLE / EDICIÓN / ZOOM ---
        window.abrirModalDetalle = function(id) {
            itemEditandoId = id;
            const nota = notasLocales.find(n => n.id === id);
            if (!nota) return;

            document.getElementById('edit-texto').value = nota.contenido || '';
            modalFotoBase64 = nota.foto || null;
            modalAudioBase64 = nota.audio || null;

            const secFoto = document.getElementById('modal-seccion-foto');
            const imgEl = document.getElementById('modal-img');
            if (modalFotoBase64) {
                imgEl.src = modalFotoBase64;
                secFoto.style.display = 'flex';
            } else {
                secFoto.style.display = 'none';
            }

            const secAudio = document.getElementById('modal-seccion-audio');
            const audioEl = document.getElementById('modal-audio');
            if (modalAudioBase64) {
                audioEl.src = modalAudioBase64;
                secAudio.style.display = 'flex';
            } else {
                secAudio.style.display = 'none';
            }

            document.getElementById('modal-detalle').classList.add('active');
        }

        window.cerrarModal = function() {
            document.getElementById('modal-detalle').classList.remove('active');
            itemEditandoId = null;
        }

        window.ampliarImagen = function(src) {
            document.getElementById('img-ampliada').src = src;
            document.getElementById('modal-zoom').classList.add('active');
        }

        window.cerrarImagenAmpliada = function() {
            document.getElementById('modal-zoom').classList.remove('active');
        }

        window.eliminarFotoModal = function() {
            modalFotoBase64 = null;
            document.getElementById('modal-seccion-foto').style.display = 'none';
        }

        window.eliminarAudioModal = function() {
            modalAudioBase64 = null;
            document.getElementById('modal-seccion-audio').style.display = 'none';
        }

        window.cambiarFotoModal = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                modalFotoBase64 = e.target.result;
                document.getElementById('modal-img').src = modalFotoBase64;
                document.getElementById('modal-seccion-foto').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        window.toggleGrabarAudioModal = async function() {
            const btn = document.getElementById('modal-btn-record');
            if (!modalIsRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    modalMediaRecorder = new MediaRecorder(stream);
                    modalAudioChunks = [];

                    modalMediaRecorder.ondataavailable = e => modalAudioChunks.push(e.data);
                    modalMediaRecorder.onstop = () => {
                        const audioBlob = new Blob(modalAudioChunks, { type: 'audio/mp3' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            modalAudioBase64 = reader.result;
                            document.getElementById('modal-audio').src = modalAudioBase64;
                            document.getElementById('modal-seccion-audio').style.display = 'flex';
                        };
                        reader.readAsDataURL(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    modalMediaRecorder.start();
                    modalIsRecording = true;
                    btn.innerText = '🔴 Grabando...';
                } catch (err) {
                    alert('Acepta los permisos para acceder al micrófono.');
                }
            } else {
                modalMediaRecorder.stop();
                modalIsRecording = false;
                btn.innerText = '🎙️ Grabar Audio';
            }
        }

        window.guardarCambiosModal = async function() {
            if (!itemEditandoId) return;

            const nuevoTexto = document.getElementById('edit-texto').value.trim();
            const notaRef = ref(db, `notas/${itemEditandoId}`);
            
            await update(notaRef, {
                contenido: nuevoTexto,
                foto: modalFotoBase64,
                audio: modalAudioBase64
            });

            cerrarModal();
        }
    </script>
</head>
<body>

    <div class="app-container">
        
        <!-- PANTALLA PRINCIPAL: CATEGORÍAS -->
        <div id="home-screen">
            <header>
                <h1>NOTAS <span>TONECHO</span></h1>
            </header>
            <div class="categories-grid">
                <button class="category-card cat-personal" onclick="abrirSeccion('personal')">
                    <span class="count-badge" id="badge-personal">0 u.</span>
                    <span class="material-icons-round">person</span>
                    <span class="cat-name">Personal</span>
                </button>
                <button class="category-card cat-trabajo" onclick="abrirSeccion('trabajo')">
                    <span class="count-badge" id="badge-trabajo">0 u.</span>
                    <span class="material-icons-round">business_center</span>
                    <span class="cat-name">Trabajo</span>
                </button>
                <button class="category-card cat-casa" onclick="abrirSeccion('casa')">
                    <span class="count-badge" id="badge-casa">0 u.</span>
                    <span class="material-icons-round">home_work</span>
                    <span class="cat-name">Casa</span>
                </button>
                <button class="category-card cat-familia" onclick="abrirSeccion('familia')">
                    <span class="count-badge" id="badge-familia">0 u.</span>
                    <span class="material-icons-round">diversity_3</span>
                    <span class="cat-name">Familia</span>
                </button>
            </div>
        </div>

        <!-- PANTALLA DE SECCIÓN INDIVIDUAL -->
        <div id="section-screen" class="section-view">
            <div class="section-header">
                <button class="btn-back" onclick="volverAInicio()">
                    <span class="material-icons-round">arrow_back</span>
                </button>
                <h2 id="section-title" class="section-title">Categoría</h2>
            </div>

            <!-- Formulario para nueva nota -->
            <div class="note-form">
                <textarea id="note-text-input" class="note-input" placeholder="Escribe tu nota aquí..."></textarea>
                
                <div id="preview-container" class="preview-container">
                    <button class="btn-remove-preview" onclick="cancelarFoto()">×</button>
                    <img id="image-preview" src="" alt="Previsualización">
                </div>

                <div id="recording-status" class="recording-status"></div>

                <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">

                <div class="media-buttons">
                    <div style="display: flex; gap: 8px;">
                        <button class="btn-action" onclick="activarCamara()">
                            <span class="material-icons-round" style="font-size: 18px; color: #ff6b81;">photo_camera</span>
                            Foto
                        </button>
                        <button id="btn-mic" class="btn-action" onclick="toggleGrabacionAudio()">
                            <span class="material-icons-round" style="font-size: 18px; color: #1dd1a1;">mic</span>
                            Audio
                        </button>
                    </div>
                    <button class="btn-action btn-add-note" onclick="guardarNuevaNota()">
                        <span class="material-icons-round" style="font-size: 18px;">add</span>
                        Guardar
                    </button>
                </div>
            </div>

            <!-- Lista de Notas -->
            <div id="notes-list-container" class="notes-list"></div>
        </div>

    </div>

    <!-- MODAL DETALLE Y EDICIÓN -->
    <div id="modal-detalle" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Nota</h3>
                <button class="btn-icon" onclick="cerrarModal()">
                    <span class="material-icons-round">close</span>
                </button>
            </div>
            
            <textarea id="edit-texto" class="note-input" style="background: var(--bg-input); padding:10px; border-radius:10px; border: 1px solid var(--border-glass);" placeholder="Editar texto..."></textarea>
            
            <div id="modal-seccion-foto" style="display:none; flex-direction:column; gap:8px;">
                <label style="font-size:12px; color:var(--text-muted)">Foto (toca para ampliar):</label>
                <img id="modal-img" class="img-preview-full" src="" alt="Foto" onclick="ampliarImagen(this.src)">
                <button class="btn-action" style="color:var(--danger);" onclick="eliminarFotoModal()">Quitar Foto</button>
            </div>

            <div id="modal-seccion-audio" style="display:none; flex-direction:column; gap:8px;">
                <label style="font-size:12px; color:var(--text-muted)">Audio registrado:</label>
                <audio id="modal-audio" controls style="width:100%;"></audio>
                <button class="btn-action" style="color:var(--danger);" onclick="eliminarAudioModal()">Quitar Audio</button>
            </div>

            <div style="border-top: 1px solid var(--border-glass); padding-top: 10px;">
                <label style="font-size:12px; color:var(--text-muted)">Añadir o cambiar multimedia:</label>
                <div class="media-buttons" style="border:none; padding:5px 0 0 0;">
                    <input type="file" id="modal-input-foto" accept="image/*" style="display:none" onchange="cambiarFotoModal(event)">
                    <button class="btn-action" onclick="document.getElementById('modal-input-foto').click()">📷 Cambiar Foto</button>
                    <button class="btn-action" id="modal-btn-record" onclick="toggleGrabarAudioModal()">🎙️ Grabar Audio</button>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-action btn-add-note" onclick="guardarCambiosModal()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- MODAL AMPLIFICA FOTO PANTALLA COMPLETA -->
    <div id="modal-zoom" class="modal-zoom" onclick="cerrarImagenAmpliada()">
        <img id="img-ampliada" src="" alt="Foto Ampliada">
    </div>

</body>
</html>
