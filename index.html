<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notas Tonecho</title>
    <link rel="manifest" href="manifest.json">
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        /* --- DISEÑO MODO OSCURO PREMIUM ADAPTADO PARA MÓVILES --- */
        :root {
            --bg-dark-body: #090d16;
            --bg-card: #151f32;
            --bg-input: #1e2d4a;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            
            --color-personal: linear-gradient(135deg, #ff4757, #ff6b81);
            --color-trabajo: linear-gradient(135deg, #2e86de, #54a0ff);
            --color-casa: linear-gradient(135deg, #10ac84, #1dd1a1);
            --color-familia: linear-gradient(135deg, #8e44ad, #9b59b6);
            
            --danger: #ff6b6b;
            --success: #1dd1a1;
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark-body);
            color: var(--text-light);
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--bg-card);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            padding: 20px;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-glass);
            margin-top: 10px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }
        
        h1 span {
            background: linear-gradient(135deg, #54a0ff, #1dd1a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- CUADRÍCULA DE CATEGORÍAS --- */
        .categories-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .category-card {
            border: none;
            border-radius: 18px;
            padding: 22px 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            color: white;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .cat-personal { background: var(--color-personal); }
        .cat-trabajo { background: var(--color-trabajo); }
        .cat-casa { background: var(--color-casa); }
        .cat-familia { background: var(--color-familia); }

        .category-card:active {
            transform: scale(0.96);
            filter: brightness(1.1);
        }

        .category-card span.material-icons-round {
            font-size: 36px;
            text-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        .category-card .cat-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* --- PANTALLA DE SECCIÓN --- */
        .section-view {
            display: none;
            flex-direction: column;
            flex-grow: 1;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-glass);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            text-transform: capitalize;
            color: #fff;
            flex-grow: 1;
        }

        /* --- FORMULARIO DE NOTA ADAPTADO --- */
        .note-form {
            background: var(--bg-input);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .note-input {
            width: 100%;
            border: none;
            background: transparent;
            resize: none;
            font-size: 15px;
            outline: none;
            min-height: 70px;
            margin-bottom: 10px;
            color: var(--text-light);
        }
        
        .note-input::placeholder {
            color: #64748b;
        }

        /* Contenedor para previsualizar la foto antes de guardarla */
        .preview-container {
            display: none;
            position: relative;
            margin-bottom: 12px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-glass);
        }

        .preview-container img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            display: block;
        }

        .btn-remove-preview {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Estado de grabación de Audio */
        .recording-status {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--danger);
            font-weight: 600;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .media-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .btn-action.active {
            background: rgba(255, 107, 107, 0.2);
            color: var(--danger);
            border-color: var(--danger);
        }

        .btn-add-note {
            background: linear-gradient(135deg, #1dd1a1, #10ac84);
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: 700;
        }

        /* --- LISTADO DE NOTAS --- */
        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
        }

        .note-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .note-content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
            word-break: break-word;
        }

        .note-content {
            font-size: 14px;
            line-height: 1.4;
            color: var(--text-light);
        }

        .note-image {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 5px;
            border: 1px solid var(--border-glass);
        }

        .note-audio {
            width: 100%;
            height: 36px;
            margin-top: 5px;
            border-radius: 10px;
        }

        .note-expiry {
            font-size: 10px;
            color: var(--danger);
            font-weight: 600;
        }

        .note-item.deleted {
            opacity: 0.45;
        }

        .note-item.deleted .note-content {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .note-actions {
            display: flex;
            gap: 4px;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:active {
            background: rgba(255, 107, 107, 0.15);
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Configuración de tu base de datos de Notas Tonecho
        const firebaseConfig = {
            apiKey: "AIzaSyAAFnywv6kE1UJcw2SdDdEgxftMy5q7wBo",
            authDomain: "notas-tonecho.firebaseapp.com",
            databaseURL: "https://notas-tonecho-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "notas-tonecho",
            storageBucket: "notas-tonecho.firebasestorage.app",
            messagingSenderId: "519494944214",
            appId: "1:519494944214:web:b7e292cccc219ac803d077",
            measurementId: "G-YKFF06FCXL"
        };

        // Inicializar la conexión
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Elementos de la interfaz
        const homeScreen = document.getElementById('home-screen');
        const sectionScreen = document.getElementById('section-screen');
        const sectionTitle = document.getElementById('section-title');
        const noteTextInput = document.getElementById('note-text-input');
        const notesListContainer = document.getElementById('notes-list-container');
        
        // Elementos multimedia
        const cameraInput = document.getElementById('camera-input');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');
        const recordingStatus = document.getElementById('recording-status');
        const btnMic = document.getElementById('btn-mic');

        let categoriaActual = '';
        let currentQueryRef = null;
        
        // Variables para foto y audio
        let base64ImageData = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let base64AudioData = null;
        let isRecording = false;

        // Navegación: Abrir sección y sincronizar en tiempo real con tu base de datos
        window.abrirSeccion = function(categoria) {
            categoriaActual = categoria;
            homeScreen.style.display = 'none';
            sectionScreen.style.display = 'flex';
            sectionTitle.textContent = categoria;
            resetMediaForm();

            if (currentQueryRef) {
                onValue(currentQueryRef, () => {});
            }

            const dbRef = ref(db, 'notas');
            currentQueryRef = dbRef;
            
            onValue(dbRef, (snapshot) => {
                const notas = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach((key) => {
                        if (data[key].categoria === categoriaActual) {
                            notas.push({ id: key, ...data[key] });
                        }
                    });
                }
                renderizarNotas(notas);
            }, (error) => {
                console.error("Error al leer de la nube: ", error);
            });
        }

        // Navegación: Volver al menú principal
        window.volverAInicio = function() {
            sectionScreen.style.display = 'none';
            homeScreen.style.display = 'block';
            categoriaActual = '';
            resetMediaForm();
        }

        // --- FUNCIONES MULTIMEDIA ---

        // Abrir Cámara / Galería
        window.activarCamara = function() {
            cameraInput.click();
        }

        // Procesar la foto seleccionada
        cameraInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    base64ImageData = event.target.result;
                    imagePreview.src = base64ImageData;
                    previewContainer.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Cancelar foto adjunta
        window.cancelarFoto = function() {
            base64ImageData = null;
            imagePreview.src = '';
            previewContainer.style.display = 'none';
            cameraInput.value = '';
        }

        // Grabar Audio utilizando micrófono nativo
        window.toggleGrabacionAudio = async function() {
            if (!isRecording) {
                // Iniciar grabación
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.addEventListener("dataavailable", event => {
                        audioChunks.push(event.data);
                    });

                    mediaRecorder.addEventListener("stop", () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            base64AudioData = reader.result;
                            recordingStatus.innerHTML = `<span class="material-icons-round" style="font-size:16px;">check_circle</span> Audio grabado listo para guardar.`;
                        };
                        reader.readAsDataURL(audioBlob);
                        
                        // Apagar el micrófono del teléfono
                        stream.getTracks().forEach(track => track.stop());
                    });

                    mediaRecorder.start();
                    isRecording = true;
                    btnMic.classList.add('active');
                    recordingStatus.style.display = 'flex';
                    recordingStatus.innerHTML = `<span class="material-icons-round" style="font-size:16px; color:#ff6b6b;">fiber_manual_record</span> Grabando nota de voz... (pulsa el micro para parar)`;
                } catch (err) {
                    alert("Por favor, acepta los permisos de micrófono en tu navegador para grabar audios.");
                }
            } else {
                // Detener grabación
                if (mediaRecorder) {
                    mediaRecorder.stop();
                }
                isRecording = false;
                btnMic.classList.remove('active');
            }
        }

        // Limpiar multimedia del formulario
        function resetMediaForm() {
            cancelarFoto();
            base64AudioData = null;
            isRecording = false;
            if (btnMic) btnMic.classList.remove('active');
            if (recordingStatus) recordingStatus.style.display = 'none';
            if (noteTextInput) noteTextInput.value = '';
        }

        // Guardar Nota Nueva en la nube con multimedia opcional
        window.guardarNuevaNota = async function() {
            const texto = noteTextInput.value.trim();
            
            // Permitimos guardar si hay texto, foto o audio
            if (texto === '' && !base64ImageData && !base64AudioData) {
                alert('Escribe un texto o añade multimedia antes de guardar.');
                return;
            }

            try {
                const dbRef = ref(db, 'notas');
                const nuevaNotaRef = push(dbRef);
                await set(nuevaNotaRef, {
                    categoria: categoriaActual,
                    contenido: texto,
                    foto: base64ImageData || null,
                    audio: base64AudioData || null,
                    eliminada: false,
                    fechaEliminacion: null,
                    fechaCreacion: Date.now()
                });
                
                resetMediaForm();
            } catch (error) {
                alert("No se ha podido guardar la nota: " + error.message);
            }
        }

        // Tachar una nota
        window.marcarComoEliminada = async function(id) {
            try {
                const notaRef = ref(db, `notas/${id}`);
                await update(notaRef, {
                    eliminada: true,
                    fechaEliminacion: Date.now()
                });
            } catch (error) {
                console.error("Error al borrar: ", error);
            }
        }

        // Restaurar nota tachada
        window.restaurarNota = async function(id) {
            try {
                const notaRef = ref(db, `notas/${id}`);
                await update(notaRef, {
                    eliminada: false,
                    fechaEliminacion: null
                });
            } catch (error) {
                console.error("Error al recuperar: ", error);
            }
        }

        // Mostrar notas con soporte para Foto y Audio
        async function renderizarNotas(notas) {
            notesListContainer.innerHTML = '';
            const ahora = Date.now();
            const unaSemanaEnMilisegundos = 7 * 24 * 60 * 60 * 1000;

            if (notas.length === 0) {
                notesListContainer.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:14px; margin-top:20px;">No hay notas aquí.</p>';
                return;
            }

            // Ordenar: Primero las activas y al final las tachadas
            notas.sort((a, b) => {
                if (a.eliminada && !b.eliminada) return 1;
                if (!a.eliminada && b.eliminada) return -1;
                return b.fechaCreacion - a.fechaCreacion;
            });

            for (const nota of notas) {
                // Borrado definitivo automático tras 7 días
                if (nota.eliminada && (ahora - nota.fechaEliminacion > unaSemanaEnMilisegundos)) {
                    try {
                        const notaRef = ref(db, `notas/${nota.id}`);
                        await remove(notaRef);
                    } catch (e) {
                        console.error("Error en la auto-limpieza: ", e);
                    }
                    continue; 
                }

                const notaDiv = document.createElement('div');
                notaDiv.className = `note-item ${nota.eliminada ? 'deleted' : ''}`;

                let botonAccion = '';
                let textoExpiracion = '';
                let elementoFoto = '';
                let elementoAudio = '';

                // Si la nota tiene foto
                if (nota.foto) {
                    elementoFoto = `<img src="${nota.foto}" class="note-image" alt="Imagen de nota">`;
                }

                // Si la nota tiene audio grabado
                if (nota.audio) {
                    elementoAudio = `<audio controls class="note-audio" src="${nota.audio}"></audio>`;
                }

                if (nota.eliminada) {
                    const milisegundosRestantes = (nota.fechaEliminacion + unaSemanaEnMilisegundos) - ahora;
                    const diasRestantes = Math.ceil(milisegundosRestantes / (1000 * 60 * 60 * 24));
                    
                    textoExpiracion = `<span class="note-expiry">Se elimina en ${diasRestantes} d.</span>`;
                    botonAccion = `
                        <button class="btn-icon btn-restore" title="Recuperar" onclick="restaurarNota('${nota.id}')">
                            <span class="material-icons-round" style="color: var(--success);">restore</span>
                        </button>
                    `;
                } else {
                    botonAccion = `
                        <button class="btn-icon" title="Archivar" onclick="marcarComoEliminada('${nota.id}')">
                            <span class="material-icons-round" style="color: var(--danger);">delete</span>
                        </button>
                    `;
                }

                notaDiv.innerHTML = `
                    <div class="note-content-wrapper">
                        ${nota.contenido ? `<div class="note-content">${nota.contenido}</div>` : ''}
                        ${elementoFoto}
                        ${elementoAudio}
                        ${textoExpiracion}
                    </div>
                    <div class="note-actions">
                        ${botonAccion}
                    </div>
                `;
                notesListContainer.appendChild(notaDiv);
            }
        }
    </script>
</head>
<body>

    <div class="app-container">
        
        <div id="home-screen">
            <header>
                <h1>NOTAS <span>TONECHO</span></h1>
            </header>
            <div class="categories-grid">
                <button class="category-card cat-personal" onclick="abrirSeccion('personal')">
                    <span class="material-icons-round">person</span>
                    <span class="cat-name">Personal</span>
                </button>
                <button class="category-card cat-trabajo" onclick="abrirSeccion('trabajo')">
                    <span class="material-icons-round">business_center</span>
                    <span class="cat-name">Trabajo</span>
                </button>
                <button class="category-card cat-casa" onclick="abrirSeccion('casa')">
                    <span class="material-icons-round">home_work</span>
                    <span class="cat-name">Casa</span>
                </button>
                <button class="category-card cat-familia" onclick="abrirSeccion('familia')">
                    <span class="material-icons-round">diversity_3</span>
                    <span class="cat-name">Familia</span>
                </button>
            </div>
        </div>

        <div id="section-screen" class="section-view">
            <div class="section-header">
                <button class="btn-back" onclick="volverAInicio()">
                    <span class="material-icons-round">arrow_back</span>
                </button>
                <h2 id="section-title" class="section-title">Categoría</h2>
            </div>

            <div class="note-form">
                <textarea id="note-text-input" class="note-input" placeholder="¿Qué tienes en mente hoy?..."></textarea>
                
                <div id="preview-container" class="preview-container">
                    <button class="btn-remove-preview" onclick="cancelarFoto()">×</button>
                    <img id="image-preview" src="" alt="Previsualización">
                </div>

                <div id="recording-status" class="recording-status"></div>

                <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">

                <div class="media-buttons">
                    <div style="display: flex; gap: 8px;">
                        <button class="btn-action" onclick="activarCamara()">
                            <span class="material-icons-round" style="font-size: 18px; color: #ff6b81;">photo_camera</span>
                            Foto
                        </button>
                        <button id="btn-mic" class="btn-action" onclick="toggleGrabacionAudio()">
                            <span class="material-icons-round" style="font-size: 18px; color: #1dd1a1;">mic</span>
                            Audio
                        </button>
                    </div>
                    <button class="btn-action btn-add-note" onclick="guardarNuevaNota()">
                        <span class="material-icons-round" style="font-size: 18px;">add</span>
                        Guardar
                    </button>
                </div>
            </div>

            <div id="notes-list-container" class="notes-list">
                </div>
        </div>

    </div>
</body>
</html>
